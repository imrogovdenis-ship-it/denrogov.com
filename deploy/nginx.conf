# denrogov.com — боевой конфиг nginx (аудит 2026-08-27, AI-79/80/83/84)
server_tokens off;

# Сжатие (text/html включён по умолчанию)
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json
           application/xml text/plain image/svg+xml application/rss+xml;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # За TLS-терминатором Traefik: относительные Location в редиректах
    absolute_redirect off;

    # Заголовки безопасности (AI-84)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Сначала только отчёты: Tilda использует inline-скрипты и eval. После
    # недели чистых отчётов заголовок можно перевести в enforcement-режим.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://forms.tildacdn.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://analytics.ai-class.tech https://neo.tildacdn.com https://ws.tildacdn.com https://static.tildacdn.com https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; connect-src 'self' https://analytics.ai-class.tech https://neo.tildacdn.com https://ws.tildacdn.com https://forms.tildacdn.com https://mc.yandex.ru https://mc.yandex.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://neo.tildacdn.com https://static.tildacdn.com; font-src 'self' data: https://fonts.gstatic.com https://static.tildacdn.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' blob: https:; worker-src 'self' blob:" always;

    # Служебные файлы недоступны (AI-80)
    location ~ /\.(?!well-known) { return 404; }
    location = /htaccess.txt     { return 404; }
    location = /readme.txt       { return 404; }

    # Статика: долгий кеш + повтор security-заголовков (add_header не наследуется)
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|woff2?|ttf|eot|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Красивые URL → файлы страниц ----
    location = /                  { try_files /index.html =404; }

    location ~ ^/booking/15/?$    { try_files /page53959051.html =404; }
    location ~ ^/booking/30/?$    { try_files /page54052193.html =404; }
    location ~ ^/booking/60/?$    { try_files /page54052815.html =404; }
    location ~ ^/booking/90/?$    { try_files /page54052831.html =404; }
    location ~ ^/booking/?$       { try_files /page54053171.html =404; }

    location ~ ^/tochka-vhoda/?$  { try_files /page155407766.html =404; }
    location ~ ^/ai-class/?$      { try_files /page155408376.html =404; }
    location ~ ^/registration/?$  { try_files /page51691963.html =404; }

    location ~ ^/old/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /page47014073.html =404;
    }

    location ~ ^/soglasie-na-rassylku/?$ { try_files /page155347966.html =404; }
    location ~ ^/soglasie-na-obrabotku-personalnyh-dannyh/?$ { try_files /page155395206.html =404; }
    location ~ ^/publichnaya-oferta/?$   { try_files /page155395496.html =404; }
    location ~ ^/politika-obrabotki-personalnyh-dannyh/?$    { try_files /page155407586.html =404; }
    location ~ ^/politika-ispolzovaniya-faylov-cookie/?$     { try_files /page155407676.html =404; }

    # ---- Блог: существующее отдаём, потерянные 301 → /blog (AI-83) ----
    location ~ ^/blog/?$ { try_files /page142046366.html =404; }
    location /blog/ {
        try_files $uri $uri/ $uri/index.html @blog_gone;
    }
    location /tpost/ { return 301 /blog; }
    location @blog_gone { return 301 /blog; }

    # ---- Канонизация: pageNNN.html → 301 на красивые URL ----
    location = /page137462456.html { return 301 /; }
    location = /page100540816.html { return 301 /; }
    location = /page47014073.html  { return 301 /old; }
    location = /page51691963.html  { return 301 /registration; }
    location = /page53959051.html  { return 301 /booking/15; }
    location = /page54052193.html  { return 301 /booking/30; }
    location = /page54052815.html  { return 301 /booking/60; }
    location = /page54052831.html  { return 301 /booking/90; }
    location = /page54053171.html  { return 301 /booking; }
    location = /page142046366.html { return 301 /blog; }
    location = /page155347966.html { return 301 /soglasie-na-rassylku; }
    location = /page155395206.html { return 301 /soglasie-na-obrabotku-personalnyh-dannyh; }
    location = /page155395496.html { return 301 /publichnaya-oferta; }
    location = /page155407586.html { return 301 /politika-obrabotki-personalnyh-dannyh; }
    location = /page155407676.html { return 301 /politika-ispolzovaniya-faylov-cookie; }
    location = /page155407766.html { return 301 /tochka-vhoda; }
    location = /page155408376.html { return 301 /ai-class; }

    # Машиночитаемый health endpoint для мониторинга Hermes (ROG-32)
    location = /api/health {
        default_type application/json;
        return 200 '{"ok":true,"service":"denrogov.com"}';
    }

    # Ошибки
    error_page 404 /404.html;
    location = /404.html { internal; }
    error_page 500 502 503 504 /50x.html;

    autoindex off;
}
