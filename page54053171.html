function parts(tz){const d=new Date();const p=new Intl.DateTimeFormat('ru-RU',{timeZone:tz,weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d);const g=t=>p.find(x=>x.type===t)?.value||'';return {time:g('hour')+':'+g('minute'),date:(g('weekday')+', '+g('day')+' '+g('month')).replace(/\.$/,'')}}
