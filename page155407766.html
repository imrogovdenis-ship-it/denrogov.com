function levelOf(i) {
  if (i < 35) return { name: "СТАРТ", note: "Ты в самом начале — и это преимущество: с первого дня можно строить правильную систему, без переучивания." };

}

function computeResults(a) {
  function v(id) { return a[id]; }
  function inc(id, i) { return Array.isArray(a[id]) && a[id].indexOf(i) >= 0; }
  function sc(id) { return typeof a[id] === "number" ? a[id] : 0; }

  var creative = 0, analytical = 0, tech = 0, communication = 0, drive = 0;

  creative += sc("q13") * 4;
  if (inc("q11", 1)) creative += 12; if (inc("q11", 3)) creative += 8; if (inc("q11", 7)) creative += 10;
  if (inc("q6", 1)) creative += 8; if (inc("q6", 2)) creative += 6; if (inc("q6", 3)) creative += 5; if (inc("q6", 13)) creative += 4;
  if (inc("q16", 1)) creative += 6; if (inc("q16", 8)) creative += 3; if (inc("q16", 9)) creative += 4; if (inc("q16", 2)) creative += 3;
  if (v("q18") === 1) creative += 10; if (v("q18") === 2) creative += 6;
  if (v("q15") === 1) creative += 6;

  analytical += sc("q14") * 4;
  if (inc("q11", 2)) analytical += 12; if (inc("q11", 8)) analytical += 8; if (inc("q11", 4)) analytical += 6;
  if (inc("q6", 8)) analytical += 10; if (inc("q6", 11)) analytical += 6; if (inc("q6", 7)) analytical += 5;
  if (v("q18") === 3) analytical += 10;
  if (v("q15") === 3) analytical += 8; if (v("q15") === 5) analytical += 8; if (v("q15") === 0) analytical += 6;
  if (inc("q16", 7)) analytical += 5;
  if (inc("q19", 4)) analytical += 6;

  tech += Math.round(sc("q10") * 3.5);
  if (inc("q9", 7)) tech += 14; if (inc("q9", 8)) tech += 14; if (inc("q9", 6)) tech += 6; if (inc("q9", 2)) tech += 4;
  if (inc("q6", 9)) tech += 12; if (inc("q6", 8)) tech += 6;
  if (inc("q11", 6)) tech += 12;
  if (inc("q16", 0)) tech += 8;
  if (inc("q19", 7)) tech += 8; if (inc("q19", 5)) tech += 6;

  communication += Math.round(sc("q12") * 3.5);
  if (inc("q11", 0)) communication += 10; if (inc("q11", 5)) communication += 8; if (inc("q11", 9)) communication += 8;
  if (inc("q11", 10)) communication += 8; if (inc("q11", 3)) communication += 6; if (inc("q11", 11)) communication += 6;
  if (inc("q6", 0)) communication += 8; if (inc("q6", 6)) communication += 8; if (inc("q6", 4)) communication += 6;
  if (inc("q6", 10)) communication += 6; if (inc("q6", 12)) communication += 4;
  if (v("q18") === 0) communication += 8; if (v("q18") === 4) communication += 8;
  if (inc("q16", 4)) communication += 4; if (inc("q16", 5)) communication += 4;

  var q8v = v("q8");
  if (q8v === 0) drive += 25; else if (q8v === 1) drive += 18; else if (q8v === 2) drive += 10; else if (q8v === 3) drive += 12; else if (q8v === 4) drive += 2;
  var q3v = v("q3");
  if (q3v === 4) drive += 20; else if (q3v === 3) drive += 15; else if (q3v === 7) drive += 8;
  var q24v = v("q24");
  if (q24v === 2) drive += 20; else if (q24v === 1) drive += 10; else if (q24v === 3) drive += 8;
  drive += sc("q22") * 2;
  var q23v = v("q23");
  if (q23v === 4) drive += 12; else if (q23v === 3) drive += 8; else if (q23v === 2) drive += 5;
  if (inc("q11", 11)) drive += 6; if (inc("q11", 10)) drive += 6;

  function capv(x) { return Math.max(4, Math.min(100, Math.round(x))); }
  var dims = { creative: capv(creative), analytical: capv(analytical), tech: capv(tech), communication: capv(communication), drive: capv(drive) };

  var idx = sc("q10") * 3;
  if (inc("q9", 7)) idx += 20;
  if (inc("q9", 8)) idx += 8;
  idx += [4, 10, 16, 22, 26][typeof q23v === "number" ? q23v : 0] || 0;
  if (inc("q16", 0)) idx += 8;
  idx += Math.min(8, (Array.isArray(a.q19) ? a.q19.length : 0) * 2);
  if (inc("q11", 6)) idx += 6;
  idx = Math.max(6, Math.min(100, Math.round(idx)));
  var level = levelOf(idx);

  var sorted = DIM_ORDER.slice().sort(function(x, y) { return dims[y] - dims[x] || DIM_ORDER.indexOf(x) - DIM_ORDER.indexOf(y); });
  var pair = [sorted[0], sorted[1]].sort(function(x, y) { return DIM_ORDER.indexOf(x) - DIM_ORDER.indexOf(y); });
  var arch = ARCHETYPES[pair.join("+")];

  var insights = [];
  insights.push({ t: "Твоя связка",
    d: DIM_RU[sorted[0]] + " + " + DIM_RU[sorted[1]] + " — ведущие оси профиля (" + dims[sorted[0]] + "% и " + dims[sorted[1]] + "%). Отсюда твой архетип: «" + arch.title + "»." });
  insights.push({ t: "Готовность к ИИ",
    d: "Индекс " + idx + "/100 — уровень «" + level.name.toLowerCase() + "». " + (HOURS_NOTES[q23v] || HOURS_NOTES[0]) });
  var f = v("q18");
  insights.push({ t: "Твой формат",
    d: (typeof f === "number" && f <= 4)
      ? "Твой естественный формат — " + FORMAT_RU[f] + ". Выбирай направления, где он основной: первые результаты придут быстрее."
      : "Формат пока не выбран — по осям тебя тянет к направлению «" + DIM_RU[sorted[0]] + "». Тестируй форматы короткими спринтами по неделе." });
  insights.push({ t: "Цель и деньги",
    d: "Твоя цель — " + (GOAL_SHORT[q24v] || GOAL_SHORT[5]) + ". " + (INCOME_NOTES[v("q25")] || INCOME_NOTES[1]) });

  var tools = arch.tools.slice();
  if (!inc("q9", 7)) {
    tools.unshift({ t: "ChatGPT или Claude", d: "Твоя первая точка входа: 30 минут в день на реальных рабочих задачах — база для всего остального." });
    tools = tools.slice(0, 4);
  }

  var obstacles = Array.isArray(a.q26) ? a.q26.slice(0, 3) : [];
  var steps = obstacles.map(function(i) { return OBSTACLE_STEPS[i]; }).filter(Boolean);

  return { dims: dims, idx: idx, level: level, arch: arch, insights: insights, tools: tools, money: arch.money, steps: steps, top: sorted };
}

/* ============================================================
   Отправка результатов в Google Таблицу
   ============================================================ */

function answersReadable() {
  var out = {};
  QUESTIONS.forEach(function(q) {
    var v = answers[q.id], a = "";
    if (q.type === "single") a = typeof v === "number" ? q.options[v] : "";
    else if (q.type === "multi") a = (Array.isArray(v) && v.length) ? v.map(function(i) { return q.options[i]; }).join(", ") : "";
    else if (q.type === "scale") a = typeof v === "number" ? String(v) : "";
    else a = (v || "").toString().trim();
    out[q.id] = a;
  });
  return out;
}

function sendResults() {
  if (!SHEETS_ENDPOINT) return;
  try {
    var res = computeResults(answers);
    var payload = JSON.stringify({
      src: SRC,
      version: TEST_VERSION,
      name: lead.name || "",
      contact: lead.contact || "",
      consent: lead.consent ? "да" : "",
      marketing: lead.marketing ? "да" : "",
      archetype: res.arch.title,
      idx: res.idx,
      level: res.level.name,
      dims: res.dims,
      answers: answersReadable()
    });
    var sent = false;
    if (navigator.sendBeacon) {
      sent = navigator.sendBeacon(SHEETS_ENDPOINT, new Blob([payload], { type: "text/plain" }));
    }
    if (!sent) {
      fetch(SHEETS_ENDPOINT, { method: "POST", mode: "no-cors", body: payload });
    }
  } catch (e) {}
}

function pad2(n) { return String(n).length < 2 ? "0" + n : String(n); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function isAnswered(q, answers) {
  if (q.optional) return true;
  var v = answers[q.id];
  if (q.type === "single" || q.type === "scale") return typeof v === "number";
  if (q.type === "multi") return Array.isArray(v) && v.length > 0;
  return typeof v === "string" && v.trim().length > 0;
}

function archTitleHtml(title) {
  if (title.indexOf("ИИ-") === 0) return '<span class="b">ИИ</span>-' + esc(title.slice(3));
  var sp = title.indexOf(" ");
  if (sp > 0) return '<span class="b">' + esc(title.slice(0, sp)) + "</span>" + esc(title.slice(sp));
  return esc(title);
}

function restart() {
  clearTimeout(autoTimer);
  screen = "intro"; cur = 0; maxV = 0; answers = {};
  barsShown = false; idxShown = false; dataSent = false;
  lead = { name: "", contact: "", consent: false, marketing: false, error: "", status: "form" };

function scheduleAdvance(from) {
  if (from >= TOTAL - 1) return;
  clearTimeout(autoTimer);
  autoTimer = setTimeout(function() {
    if (screen === "survey" && cur === from) {
      cur = from + 1; maxV = Math.max(maxV, cur);
      render(true); window.scrollTo(0, 0);
    }
  }, 260);
}

function selectVal(id, val) {
  answers[id] = val;
  render(false);
  scheduleAdvance(cur);
}

function toggleMulti(id, i) {
  var q = QUESTIONS[cur];
  var arr = Array.isArray(answers[id]) ? answers[id].slice() : [];
  var at = arr.indexOf(i);
  if (at >= 0) arr.splice(at, 1);
  else { if (q.max && arr.length >= q.max) return; arr.push(i); }
  answers[id] = arr;
  render(false);
}

function setText(id, v) {
  answers[id] = v;
  var b = document.getElementById("nextBtn");
  if (b) b.disabled = !isAnswered(QUESTIONS[cur], answers);
}

function goPrev() {
  clearTimeout(autoTimer);
  if (cur === 0) { screen = "intro"; render(true); }
  else { cur--; render(true); }
  window.scrollTo(0, 0);
}

function goNext() {
  clearTimeout(autoTimer);
  if (!isAnswered(QUESTIONS[cur], answers)) return;
  if (cur === TOTAL - 1) {
    screen = "results";
    render(true); window.scrollTo(0, 0);
  }
  else { cur++; maxV = Math.max(maxV, cur); render(true); window.scrollTo(0, 0); }
}

function jumpSection(si) {
  clearTimeout(autoTimer);
  if (SECTION_FIRST[si] > maxV) return;
  cur = SECTION_FIRST[si];
  render(true); window.scrollTo(0, 0);
}

function renderSurvey(anim) {
  var q = QUESTIONS[cur];
  var val = answers[q.id];
  var answered = isAnswered(q, answers);
  var sec = SECTIONS[q.section];

  var body = "";
  if (q.type === "single") {
    body = '<div class="opts">' + q.options.map(function(o, i) {
      return '<button class="opt' + (val === i ? " sel" : "") + '" onclick="selectVal(\'' + q.id + "'," + i + ')">'
        + '<span class="ind rd"></span><span>' + esc(o) + "</span></button>";
    }).join("") + "</div>";
  } else if (q.type === "multi") {
    body = '<div class="opts">' + q.options.map(function(o, i) {
      var sel = Array.isArray(val) && val.indexOf(i) >= 0;
      var check = sel ? '<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.2 5 9l5-6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : "";
      return '<button class="opt' + (sel ? " sel" : "") + '" onclick="toggleMulti(\'' + q.id + "'," + i + ')">'
        + '<span class="ind sq">' + check + "</span><span>" + esc(o) + "</span></button>";
    }).join("") + "</div>";
  } else if (q.type === "scale") {
    var btns = "";
    for (var n = 1; n <= 10; n++) {
      btns += '<button class="sc' + (val === n ? " sel" : "") + '" onclick="selectVal(\'' + q.id + "'," + n + ')">' + n + "</button>";
    }
    body = '<div class="scale">' + btns + '</div><div class="scale-labels"><span>' + esc(q.min) + "</span><span>" + esc(q.max) + "</span></div>";
  } else if (q.type === "text") {
    body = '<input class="tin" value="' + esc(val || "") + '" placeholder="' + esc(q.placeholder || "") + '"'
      + ' oninput="setText(\'' + q.id + '\', this.value)"'
      + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();goNext()}">';
  } else {
    body = '<textarea class="tarea" placeholder="' + esc(q.placeholder || "") + '"'
      + ' oninput="setText(\'' + q.id + '\', this.value)">' + esc(val || "") + "</textarea>";
  }

  var hint = "";
  if (q.hint) {
    var cnt = (q.max && Array.isArray(val)) ? " · выбрано " + val.length + " из " + q.max : "";
    hint = '<p class="qhint">' + esc(q.hint) + cnt + "</p>";
  }
  var tag = q.optional ? '<span class="qtag">Можно пропустить</span>' : "";

  var dots = SECTIONS.map(function(s, si) {
    var cls = si === q.section ? " now" : (SECTION_FIRST[si] <= maxV ? " was" : "");
    var dis = SECTION_FIRST[si] > maxV ? " disabled" : "";
    return '<button class="dot' + cls + '"' + dis + ' aria-label="Раздел ' + (si + 1) + ': ' + esc(s.title) + '" onclick="jumpSection(' + si + ')"></button>';
  }).join("");

  return '<div class="page">'
    + '<div class="shead">'
    +   '<div class="shead-row">'
    +     '<span class="brand-min"><span class="b">Rogov Pro</span> · ИИ-тест</span>'
    +     '<span class="counter"><span class="b">' + pad2(cur + 1) + "</span> / " + TOTAL + "</span>"
    +   '</div>'
    +   '<div class="progress"><i style="width:' + (((cur + 1) / TOTAL) * 100) + '%"></i></div>'
    + '</div>'
    + '<div class="qwrap' + (anim ? " anim" : "") + '">'
    +   eyebrowHtml("Раздел " + (q.section + 1) + " · " + esc(sec.title))
    +   '<div style="margin-top:18px">'
    +     '<div class="qnum">' + pad2(cur + 1) + "</div>"
    +     '<h2 class="qtitle">' + esc(q.title) + "</h2>"
    +     hint + tag
    +   '</div>'
    +   body
    +   '<div class="snav">'
    +     '<div class="dots">' + dots + "</div>"
    +     '<div class="nav-row">'
    +       '<button class="btn-ghost" onclick="goPrev()">← Назад</button>'
    +       '<button class="btn-primary" id="nextBtn"' + (answered ? "" : " disabled") + ' onclick="goNext()">'
    +         (cur === TOTAL - 1 ? "Показать результат ✓" : "Далее →")
    +       "</button>"
    +     '</div>'
    +   '</div>'
    + '</div></div>';
}

function render(anim) {
  if (screen === "intro") { app.innerHTML = renderIntro(); return; }
  if (screen === "survey") { app.innerHTML = renderSurvey(anim); return; }
  if (screen === "lead") { app.innerHTML = renderLead(); return; }
  app.innerHTML = renderResults();
  if (!barsShown) {
    requestAnimationFrame(function() {
      setTimeout(function() {
        var fills = document.querySelectorAll(".fill");
        for (var i = 0; i < fills.length; i++) fills[i].style.width = fills[i].getAttribute("data-w") + "%";
      }, 80);
    });
    barsShown = true;
  }
  if (!idxShown) {
    var el = document.getElementById("idxNum");
    var target = computeResults(answers).idx;
    var t0 = performance.now();
    (function tick(t) {
      var p = Math.min(1, (t - t0) / 950);
      if (el) el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
    idxShown = true;
  }
}
