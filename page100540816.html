        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        .calculator {
            width: 320px;
            background: #000;
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .display {
            background: #1c1c1c;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: right;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .previous-operand {
            color: #888;
            font-size: 24px;
            min-height: 24px;
            margin-bottom: 5px;
        }

        .current-operand {
            color: #fff;
            font-size: 48px;
            font-weight: 300;
            word-wrap: break-word;
            word-break: break-all;
            min-height: 58px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 16px;
            font-size: 24px;
            font-weight: 500;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: #fff;
        }

        button:active {
            transform: scale(0.95);
        }

        .number,
        .decimal {
            background: #333;
            color: #fff;
        }

        .number:hover,
        .decimal:hover {
            background: #444;
        }

        .operator {
            background: #ff9500;
            color: #fff;
        }

        .operator:hover {
            background: #ffb143;
        }

        .clear {
            background: #a6a6a6;
            color: #000;
            grid-column: span 2;
        }

        .clear:hover {
            background: #b8b8b8;
        }

        .equals {
            background: #ff9500;
            color: #fff;
            grid-column: span 2;
        }

        .equals:hover {
            background: #ffb143;
        }

        .delete {
            background: #a6a6a6;
            color: #000;
            font-size: 20px;
        }

        .delete:hover {
            background: #b8b8b8;
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 400px) {
            .calculator {
                width: 100%;
                max-width: 320px;
                margin: 20px;
            }

            button {
                padding: 18px;
                font-size: 22px;
            }

            .current-operand {
                font-size: 40px;
            }
        }
    </style> </head> <body> <div class="calculator"> <div class="display"> <div class="previous-operand" id="previousOperand"></div> <div class="current-operand" id="currentOperand">0</div> </div> <div class="buttons"> <button class="clear" onclick="calculator.clear()">AC</button> <button class="delete" onclick="calculator.delete()">⌫</button> <button class="operator" onclick="calculator.chooseOperation('÷')">÷</button> <button class="operator" onclick="calculator.chooseOperation('×')">×</button> <button class="number" onclick="calculator.appendNumber('7')">7</button> <button class="number" onclick="calculator.appendNumber('8')">8</button> <button class="number" onclick="calculator.appendNumber('9')">9</button> <button class="operator" onclick="calculator.chooseOperation('-')">−</button> <button class="number" onclick="calculator.appendNumber('4')">4</button> <button class="number" onclick="calculator.appendNumber('5')">5</button> <button class="number" onclick="calculator.appendNumber('6')">6</button> <button class="operator" onclick="calculator.chooseOperation('+')">+</button> <button class="number" onclick="calculator.appendNumber('1')">1</button> <button class="number" onclick="calculator.appendNumber('2')">2</button> <button class="number" onclick="calculator.appendNumber('3')">3</button> <button class="operator" onclick="calculator.chooseOperation('%')">%</button> <button class="number" style="grid-column: span 2;" onclick="calculator.appendNumber('0')">0</button> <button class="decimal" onclick="calculator.appendNumber('.')">.</button> <button class="equals" onclick="calculator.compute()">=</button> </div> </div> <script>
        class Calculator {
            constructor(previousOperandElement, currentOperandElement) {
                this.previousOperandElement = previousOperandElement;
                this.currentOperandElement = currentOperandElement;
                this.clear();
            }

            clear() {
                this.currentOperand = '';
                this.previousOperand = '';
                this.operation = undefined;
                this.updateDisplay();
            }

            delete() {
                this.currentOperand = this.currentOperand.toString().slice(0, -1);
                this.updateDisplay();
            }

            appendNumber(number) {
                if (number === '.' && this.currentOperand.includes('.')) return;
                this.currentOperand = this.currentOperand.toString() + number.toString();
                this.updateDisplay();
            }

            chooseOperation(operation) {
                if (this.currentOperand === '') return;
                if (this.previousOperand !== '') {
                    this.compute();
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '';
                this.updateDisplay();
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                if (isNaN(prev) || isNaN(current)) return;
                
                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '×':
                        computation = prev * current;
                        break;
                    case '÷':
                        computation = prev / current;
                        break;
                    case '%':
                        computation = prev % current;
                        break;
                    default:
                        return;
                }
                
                this.currentOperand = computation.toString();
                this.operation = undefined;
                this.previousOperand = '';
                this.updateDisplay();
            }

            updateDisplay() {
                this.currentOperandElement.innerText = this.currentOperand || '0';
                if (this.operation != null) {
                    this.previousOperandElement.innerText = `${this.previousOperand} ${this.operation}`;
                } else {
                    this.previousOperandElement.innerText = '';
                }
            }
        }

        const previousOperandElement = document.getElementById('previousOperand');
        const currentOperandElement = document.getElementById('currentOperand');

        const calculator = new Calculator(previousOperandElement, currentOperandElement);

        // Поддержка клавиатуры
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') calculator.appendNumber(e.key);
            if (e.key === '.') calculator.appendNumber(e.key);
            if (e.key === '+') {
                e.preventDefault();
                calculator.chooseOperation('+');
            }
            if (e.key === '-') {
                e.preventDefault();
                calculator.chooseOperation('-');
            }
            if (e.key === '*') {
                e.preventDefault();
                calculator.chooseOperation('×');
            }
            if (e.key === '/') {
                e.preventDefault();
                calculator.chooseOperation('÷');
            }
            if (e.key === '%') {
                e.preventDefault();
                calculator.chooseOperation('%');
            }
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculator.compute();
            }
            if (e.key === 'Backspace') {
                e.preventDefault();
                calculator.delete();
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                calculator.clear();
            }
        });
    </script> </body> </html> <!-- nominify end --> </div> </div> </div> </div> </div> <!--/allrecords--> <!-- Stat --> <!-- Yandex.Metrika counter 97124704 --> <script type="text/javascript" data-tilda-cookie-type="analytics">setTimeout(function(){(function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})(window,document,"script","https://mc.yandex.ru/metrika/tag.js","ym");window.mainMetrikaId='97124704';ym(window.mainMetrikaId,"init",{clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:true,params:{__ym:{"ymCms":{"cms":"tilda","cmsVersion":"1.0"}}},ecommerce:"dataLayer"});},2000);</script> <noscript><div><img src="https://mc.yandex.ru/watch/97124704" style="position:absolute; left:-9999px;" alt="" /></div></noscript> <!-- /Yandex.Metrika counter --> <script type="text/javascript">if(!window.mainTracker) {window.mainTracker='tilda';}
