name: Validate and deploy site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denrogov-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build \
            --build-arg UMAMI_WEBSITE_ID=00000000-0000-0000-0000-000000000000 \
            -t denrogov-site:test .

      - name: Run smoke tests
        run: |
          docker run -d --name denrogov-site-test -p 8080:80 denrogov-site:test
          trap 'docker logs denrogov-site-test; docker rm -f denrogov-site-test' EXIT

          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8080/api/health | grep -q '"ok":true' && break
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8080/api/health | grep -q '"service":"denrogov.com"'
          curl --fail --silent http://127.0.0.1:8080/ | grep -q '<html lang="ru">'
          curl --fail --silent http://127.0.0.1:8080/booking | grep -q 'href="https://denrogov.com/booking"'
          curl --fail --silent http://127.0.0.1:8080/blog/hermes-linear-vnutrenniy-loop-agentov/ | grep -q 'analytics.ai-class.tech/script.js'
          curl --fail --silent http://127.0.0.1:8080/blog/hermes-linear-vnutrenniy-loop-agentov/ | grep -q '/css/blog-responsive.css'
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -qi '^content-security-policy-report-only:'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/readme.txt)" = 404

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::warning::COOLIFY_WEBHOOK_URL is not configured; production deploy was skipped."
            exit 0
          fi
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --request GET "$COOLIFY_WEBHOOK_URL"
