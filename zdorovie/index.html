<title>ROGOV PRO</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{--blue:#50B1F9;--navy:#0B1220;--surface:#111A2C;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--navy);min-height:100%}
body{
  font-family:"Inter",system-ui,sans-serif;color:#fff;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;
}
.orb{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(900px,140vw);height:600px;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center,rgba(80,177,249,.18) 0%,rgba(80,177,249,.06) 40%,transparent 70%);
}
.box{position:relative;z-index:1;width:100%;max-width:412px}
.eyebrow{
  font-family:"Inter Tight",sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--blue);display:inline-block;
}
.eyebrow::after{content:"";display:block;width:34px;height:2px;background:var(--blue);margin-top:7px;border-radius:1px}
h1{
  font-family:"Inter Tight",sans-serif;font-size:34px;font-weight:900;letter-spacing:-.025em;
  line-height:1.05;margin:24px 0 0;
}
h1 em{font-style:normal;color:var(--blue)}
.sub{color:rgba(255,255,255,.55);font-size:14px;line-height:1.55;margin:14px 0 0}
form{margin-top:30px;display:flex;flex-direction:column;gap:11px}
input{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:15px 16px;color:#fff;font-family:"JetBrains Mono",monospace;font-size:16px;
  letter-spacing:.14em;outline:none;transition:border-color .15s;
}
input::placeholder{color:rgba(255,255,255,.25);letter-spacing:.1em}
input:focus{border-color:var(--blue)}
button{
  width:100%;background:var(--blue);color:#07101d;border:0;border-radius:4px;
  padding:15px 16px;font-family:"Inter Tight",sans-serif;font-size:14px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:opacity .15s;
}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:default}
.msg{
  font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.05em;
  min-height:18px;color:var(--blue);
}
.msg.err{color:#EAF5FE}
.foot{
  margin-top:34px;padding-top:20px;border-top:1px solid var(--line);
  font-family:"JetBrains Mono",monospace;font-size:11px;color:rgba(255,255,255,.30);letter-spacing:.02em;
}
.sig{font-family:"Inter Tight",sans-serif;font-size:10px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.30);margin-top:9px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function b2u(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
var f=document.getElementById('f'),p=document.getElementById('p'),b=document.getElementById('b'),m=document.getElementById('m');
f.addEventListener('submit',function(e){
  e.preventDefault();
  var pw=p.value;
  if(!pw){m.className='msg err';m.textContent='Введите пароль';return;}
  b.disabled=true;m.className='msg';m.textContent='Расшифровка…';
  (async function(){
    try{
      var enc=new TextEncoder();
      var bk=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
      var k=await crypto.subtle.deriveKey(

      document.open('text/html','replace');
      document.write(html);
      document.close();
    }catch(err){
      b.disabled=false;
      m.className='msg err';
      m.textContent='Неверный пароль';
      p.value='';p.focus();
    }
  })();
});
